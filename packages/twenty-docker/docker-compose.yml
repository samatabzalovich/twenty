name: twenty

x-twenty-image: &twenty-image
  image: ${TWENTY_IMAGE:-twenty}:${TAG:-local}
  build:
    context: ../..
    dockerfile: packages/twenty-docker/twenty/Dockerfile
    target: twenty

services:
  server:
    <<: *twenty-image
    container_name: twenty-server
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@twenty-db:5432/${PG_DATABASE_NAME:-default}
      REDIS_URL: redis://twenty-redis:6379
      SERVER_URL: ${SERVER_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED}
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN}
      FRONT_AUTO_BASE_URL: ${FRONT_AUTO_BASE_URL}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
      SAAS_AUTH_ENABLED: ${SAAS_AUTH_ENABLED}
      SAAS_AUTH_VALIDATE_URL: ${SAAS_AUTH_VALIDATE_URL}
      SAAS_AUTH_API_KEY_CALLBACK_URL: ${SAAS_AUTH_API_KEY_CALLBACK_URL}
      SAAS_AUTH_CHECK_RECEIVED_SECRET: ${SAAS_AUTH_CHECK_RECEIVED_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - twenty-internal
      - smartbiz

  worker:
    <<: *twenty-image
    container_name: twenty-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ['yarn', 'worker:prod']
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@twenty-db:5432/${PG_DATABASE_NAME:-default}
      REDIS_URL: redis://twenty-redis:6379
      SERVER_URL: ${SERVER_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - twenty-internal
      - smartbiz

  db:
    image: postgres:16
    container_name: twenty-db
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - twenty-internal

  redis:
    image: redis
    container_name: twenty-redis
    restart: unless-stopped
    command: ['--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - twenty-internal

networks:
  twenty-internal:
    name: twenty-internal
  smartbiz:
    external: true
    name: smartbiz

volumes:
  db-data:
  server-local-data:
